services:
  mariadb:
    image: mariadb:11
    container_name: pisosscraper-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    ports:
      - "${MARIADB_PORT:-3307}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
    image: pisosscraper-app:latest
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
    ports:
      - "${WEB_PORT:-8008}:8000"
    depends_on:
      mariadb:
        condition: service_healthy

  scheduler:
    image: pisosscraper-app:latest
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
    command: ["python", "deploy/weekly_scheduler.py"]
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb_data:
